<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Mechanical Manufacturing Engineering</title>
  <style>
    /* ------------------------------------
       1. STYLES DASAR & LAYOUT TENGAH
    ------------------------------------ */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* ------------------------------------
       2. SLIDESHOW LATAR BELAKANG
    ------------------------------------ */
    .bg-slideshow {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }

    .bg-slide {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .bg-slide.active { opacity: 0.15; }

    .bg-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(circle, rgba(15, 23, 42, 0.4) 0%, rgba(15, 23, 42, 0.85) 100%);
      z-index: 2;
    }

    /* ------------------------------------
       3. KARTU KONTEN UTAMA
    ------------------------------------ */
    .hero-card {
      position: relative;
      z-index: 3;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .hero-card h1 { font-size: 1.8rem; color: #f8fafc; margin-bottom: 8px; }
    .hero-card p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 28px; line-height: 1.5; }

    /* ------------------------------------
       4. TOMBOL UTAMA
    ------------------------------------ */
    .button-group { display: flex; flex-direction: column; gap: 16px; }

    .btn {
      padding: 16px 24px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-primary { background-color: #0284c7; color: #ffffff; box-shadow: 0 10px 15px -3px rgba(2, 132, 199, 0.3); }
    .btn-primary:hover { background-color: #0369a1; transform: translateY(-3px); }

    .btn-secondary { background-color: #334155; color: #f8fafc; border: 1px solid #475569; }
    .btn-secondary:hover { background-color: #475569; color: #38bdf8; border-color: #38bdf8; transform: translateY(-3px); }

    /* ------------------------------------
       5. SOSIAL MEDIA & KONTAK
    ------------------------------------ */
    .social-divider { margin: 28px 0 20px 0; border: 0; height: 1px; background: rgba(255, 255, 255, 0.1); }
    .social-links { display: flex; justify-content: center; align-items: center; gap: 16px; }

    .social-btn {
      width: 48px; height: 48px;
      border-radius: 50%; background: #334155;
      color: #94a3b8; display: flex; justify-content: center;
      align-items: center; text-decoration: none;
      border: 1px solid #475569; transition: all 0.3s ease;
    }

    .social-btn.instagram:hover { background: #e1306c; color: #fff; transform: translateY(-4px); }
    .social-btn.whatsapp:hover { background: #25d366; color: #fff; transform: translateY(-4px); }
    .social-btn.linkedin:hover { background: #0a66c2; color: #fff; transform: translateY(-4px); }
    .social-btn.email:hover { background: #ea4335; color: #fff; transform: translateY(-4px); }

    /* ------------------------------------
       6. MODAL PREVIEW PDF (JENDELA POP-UP)
    ------------------------------------ */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-container {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      width: 90%;
      max-width: 900px;
      height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .modal-header {
      padding: 16px 24px;
      background: #0f172a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    .modal-title { font-size: 1.1rem; font-weight: 600; color: #f8fafc; }

    .modal-header-actions { display: flex; gap: 12px; align-items: center; }

    .btn-download-modal {
      padding: 8px 16px;
      font-size: 0.85rem;
      border-radius: 8px;
      background: #0284c7;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-download-modal:hover { background: #0369a1; }

    .btn-close {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
      transition: color 0.2s;
    }

    .btn-close:hover { color: #f8fafc; }

    .modal-body {
      flex: 1;
      width: 100%;
      height: 100%;
      background: #334155;
    }

    .modal-body iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Background Slideshow -->
  <div class="bg-slideshow">
    <div class="bg-slide active" style="background-image: url('assets/bg-1.svg');"></div>
    <div class="bg-slide" style="background-image: url('assets/bg-2.svg');"></div>
    <div class="bg-slide" style="background-image: url('assets/bg-3.svg');"></div>
    <div class="bg-overlay"></div>
  </div>

  <!-- Kartu Utama -->
  <main class="hero-card">
    <h1>Open to Work</h1>
    <p>Please select the document you would like to view from the list below. For a clearer view of the document’s contents, please download the file</p>

    <div class="button-group">
      <!-- Tombol Preview CV (Google Drive) -->
      <button class="btn btn-secondary" onclick="openPreviewDrive('16KpfFXvfYzS0tWgQ4yrbeheLw-UaZ-la', 'Preview Curriculum Vitae PDF')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        Curriculum Vitae
      </button>

      <!-- Tombol Preview Portofolio (Google Drive) -->
      <button class="btn btn-primary" onclick="openPreviewDrive('1j-BhvPibOg8cfLvEMs3zGLtuzmsfx4WM', 'Preview Portofolio PDF')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        Portfolio
      </button>
    </div>

    <hr class="social-divider">

    <!-- Sosmed -->
    <div class="social-links">
      <a href="https://instagram.com/xyz.mve" target="_blank" rel="noopener noreferrer" class="social-btn instagram" title="Instagram">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
      </a>
      <a href="https://wa.me/6285741002715" target="_blank" rel="noopener noreferrer" class="social-btn whatsapp" title="WhatsApp">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
      </a>
      <a href="https://linkedin.com/in/faaqween" target="_blank" rel="noopener noreferrer" class="social-btn linkedin" title="LinkedIn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
      </a>
      <a href="https://mail.google.com/mail/u/0/?to=asyifakhasanah500@gmail.com&fs=1&tf=cm" class="social-btn email" title="Kirim Email">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
      </a>
    </div>
  </main>

  <!-- Jendela Modal Pop-up Preview PDF -->
  <div class="modal-overlay" id="pdfModal">
    <div class="modal-container">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">Preview Dokumen</span>
        <div class="modal-header-actions">
          <a href="" id="modalDownloadBtn" target="_blank" class="btn-download-modal">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Download File
          </a>
          <button class="btn-close" onclick="closePreview()">&times;</button>
        </div>
      </div>
      <div class="modal-body">
        <iframe id="pdfFrame" src=""></iframe>
      </div>
    </div>
  </div>

  <script>
    // Slideshow Background
    const slides = document.querySelectorAll('.bg-slide');
    let currentSlide = 0;
    setInterval(() => {
      slides[currentSlide].classList.remove('active');
      currentSlide = (currentSlide + 1) % slides.length;
      slides[currentSlide].classList.add('active');
    }, 2000);

    // Fungsi Buka Preview untuk File Google Drive (CV & Portofolio)
    function openPreviewDrive(fileId, titleText) {
      document.getElementById('modalTitle').innerText = titleText;
      
      // Embed Viewer Google Drive
      document.getElementById('pdfFrame').src = `https://drive.google.com/file/d/${fileId}/preview`;
      
      // Link Download Google Drive
      const downloadBtn = document.getElementById('modalDownloadBtn');
      downloadBtn.href = `https://drive.google.com/uc?export=download&id=${fileId}`;
      downloadBtn.setAttribute('target', '_blank');
      
      document.getElementById('pdfModal').classList.add('active');
    }

    // Fungsi Tutup Modal Preview PDF
    function closePreview() {
      document.getElementById('pdfModal').classList.remove('active');
      document.getElementById('pdfFrame').src = '';
    }
  </script>

</body>
</html>
