<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unduh CV & Portofolio</title>
  <style>
    /* ------------------------------------
       1. STYLES DASAR & TAMPILAN TENGAH
    ------------------------------------ */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* ------------------------------------
       2. SLIDESHOW LATAR BELAKANG (BG)
    ------------------------------------ */
    .bg-slideshow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .bg-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .bg-slide.active {
      opacity: 0.15;
    }

    .bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(15, 23, 42, 0.4) 0%, rgba(15, 23, 42, 0.85) 100%);
      z-index: 2;
    }

    /* ------------------------------------
       3. KARTU KONTEN UTAMA
    ------------------------------------ */
    .hero-card {
      position: relative;
      z-index: 3;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .hero-card h1 {
      font-size: 1.8rem;
      color: #f8fafc;
      margin-bottom: 8px;
    }

    .hero-card p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    /* ------------------------------------
       4. TOMBOL UTAMA (CV & PORTOFOLIO)
    ------------------------------------ */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn {
      text-decoration: none;
      padding: 16px 24px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-primary {
      background-color: #0284c7;
      color: #ffffff;
      box-shadow: 0 10px 15px -3px rgba(2, 132, 199, 0.3);
    }

    .btn-primary:hover {
      background-color: #0369a1;
      transform: translateY(-3px);
      box-shadow: 0 14px 20px -3px rgba(2, 132, 199, 0.45);
    }

    .btn-secondary {
      background-color: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
    }

    .btn-secondary:hover {
      background-color: #475569;
      color: #38bdf8;
      border-color: #38bdf8;
      transform: translateY(-3px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
    }

    /* ------------------------------------
       5. TOMBOL SOSIAL MEDIA & EMAIL
    ------------------------------------ */
    .social-divider {
      margin: 28px 0 20px 0;
      border: 0;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }

    .social-links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }

    .social-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #334155;
      color: #94a3b8;
      display: flex;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      border: 1px solid #475569;
      transition: all 0.3s ease;
    }

    /* Warna Hover Spesifik */
    .social-btn.instagram:hover {
      background: #e1306c;
      color: #ffffff;
      border-color: #e1306c;
      transform: translateY(-4px);
      box-shadow: 0 8px 16px rgba(225, 48, 108, 0.4);
    }

    .social-btn.whatsapp:hover {
      background: #25d366;
      color: #ffffff;
      border-color: #25d366;
      transform: translateY(-4px);
      box-shadow: 0 8px 16px rgba(37, 211, 102, 0.4);
    }

    .social-btn.linkedin:hover {
      background: #0a66c2;
      color: #ffffff;
      border-color: #0a66c2;
      transform: translateY(-4px);
      box-shadow: 0 8px 16px rgba(10, 102, 194, 0.4);
    }

    .social-btn.email:hover {
      background: #ea4335;
      color: #ffffff;
      border-color: #ea4335;
      transform: translateY(-4px);
      box-shadow: 0 8px 16px rgba(234, 67, 53, 0.4);
    }
  </style>
</head>
<body>

  <!-- Background Slideshow 3 Gambar SVG -->
  <div class="bg-slideshow">
    <div class="bg-slide active" style="background-image: url('assets/bg-1.svg');"></div>
    <div class="bg-slide" style="background-image: url('assets/bg-2.svg');"></div>
    <div class="bg-slide" style="background-image: url('assets/bg-3.svg');"></div>
    <div class="bg-overlay"></div>
  </div>

  <!-- Kartu Utama -->
  <main class="hero-card">
    <h1>Selamat Datang</h1>
    <p>Open to Work, Please choose the document file you want to view below:</p>

    <div class="button-group">
      <!-- Unduh CV -->
      <a href="assets/CV-Saya.pdf" download="CV-Saya.pdf" class="btn btn-secondary">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        Curriculum Vitae
      </a>

      <!-- Unduh Portofolio PDF -->
      <a href="assets/portofolio-lengkap.pdf" download="Portofolio-Saya.pdf" class="btn btn-primary">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Portfolio Manufacturing Engineering
      </a>
    </div>

    <hr class="social-divider">

    <!-- Tombol Media Sosial & Kontak -->
    <div class="social-links">
      <!-- Instagram -->
      <a href="https://instagram.com/xyz.mve" target="_blank" rel="noopener noreferrer" class="social-btn instagram" title="Instagram">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
      </a>

      <!-- WhatsApp -->
      <a href="https://wa.me/6285741002715" target="_blank" rel="noopener noreferrer" class="social-btn whatsapp" title="WhatsApp">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
        </svg>
      </a>

      <!-- LinkedIn -->
      <a href="https://linkedin.com/in/faaqween" target="_blank" rel="noopener noreferrer" class="social-btn linkedin" title="LinkedIn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
          <rect x="2" y="9" width="4" height="12"></rect>
          <circle cx="4" cy="4" r="2"></circle>
        </svg>
      </a>

      <!-- Email -->
      <a href="https://mail.google.com/mail/u/0/?to=asyifakhasanah500@gmail.com&fs=1&tf=cm" class="social-btn email" title="Kirim Email">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
          <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
      </a>
    </div>
  </main>

  <script>
    const slides = document.querySelectorAll('.bg-slide');
    let currentSlide = 0;

    function nextSlide() {
      slides[currentSlide].classList.remove('active');
      currentSlide = (currentSlide + 1) % slides.length;
      slides[currentSlide].classList.add('active');
    }

    setInterval(nextSlide, 2000);
  </script>

</body>
</html>
